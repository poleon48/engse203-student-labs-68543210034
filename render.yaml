services:
  - type: web
    name: campus-service-68543210034-week11
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/poleon48/engse203-student-labs-68543210034
    branch: main
    rootDir: labs/week-11/source
    buildCommand: npm ci --include=dev --prefix frontend && npm run build --prefix frontend && npm ci --omit=dev --prefix api
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: ""
